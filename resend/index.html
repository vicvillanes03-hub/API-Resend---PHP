<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contato</title>
<style>
  body{font-family:Arial,sans-serif;background:#f4f6fa;margin:0;padding:24px;color:#222}
  form{max-width:480px;margin:40px auto;background:#fff;padding:28px;border-radius:10px;box-shadow:0 2px 12px #0001}
  h1{margin-top:0;font-size:22px;color:#0F2E5C}
  label{display:block;margin:14px 0 4px;font-weight:bold;font-size:14px}
  input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd;border-radius:6px;font:inherit}
  textarea{min-height:130px;resize:vertical}
  button{margin-top:20px;width:100%;padding:12px;border:0;border-radius:6px;background:#0F2E5C;color:#fff;font-size:16px;cursor:pointer}
  small{color:#777}
</style>
</head>
<body>
<form action="enviar.php" method="post" enctype="multipart/form-data">
  <h1>Fale comigo</h1>

  <label for="nome">Nome</label>
  <input type="text" id="nome" name="nome" maxlength="100" required>

  <label for="email">Seu e-mail</label>
  <input type="email" id="email" name="email" required>

  <label for="mensagem">Mensagem</label>
  <textarea id="mensagem" name="mensagem" maxlength="5000" required></textarea>

  <button type="submit">Enviar</button>
</form>
</body>
</html>
